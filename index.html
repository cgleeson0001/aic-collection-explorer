<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIC Collection Explorer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>

    <nav>
      <h1>AIC Collection Explorer</h1>
    </nav>

    <main>

      <!-- SEARCH VIEW: this is what users see first -->
      <section id="search-view">

        <div id="search-bar">
          <input type="text" id="search-input" placeholder="Search artworks, artists..." />
          <button id="search-btn">Search</button>
        </div>

        <p id="error-message" style="display: none;"></p>

        <div id="results-grid">

          <!-- PLACEHOLDER CARDS: just for today so we can see the layout -->
          <!-- We will delete these on Day 4 and replace with real data -->

          <div class="artwork-card">
            <div class="card-image"></div>
            <div class="card-info">
              <p class="card-title">Artwork Title</p>
              <p class="card-artist">Artist Name</p>
            </div>
          </div>

          <div class="artwork-card">
            <div class="card-image"></div>
            <div class="card-info">
              <p class="card-title">Artwork Title</p>
              <p class="card-artist">Artist Name</p>
            </div>
          </div>

          <div class="artwork-card">
            <div class="card-image"></div>
            <div class="card-info">
              <p class="card-title">Artwork Title</p>
              <p class="card-artist">Artist Name</p>
            </div>
          </div>

          <div class="artwork-card">
            <div class="card-image"></div>
            <div class="card-info">
              <p class="card-title">Artwork Title</p>
              <p class="card-artist">Artist Name</p>
            </div>
          </div>

          <div class="artwork-card">
            <div class="card-image"></div>
            <div class="card-info">
              <p class="card-title">Artwork Title</p>
              <p class="card-artist">Artist Name</p>
            </div>
          </div>

          <div class="artwork-card">
            <div class="card-image"></div>
            <div class="card-info">
              <p class="card-title">Artwork Title</p>
              <p class="card-artist">Artist Name</p>
            </div>
          </div>

        </div>
      </section>

      <!-- DETAIL VIEW: hidden for now, we build this on Day 5 -->
      <section id="detail-view" style="display: none;">
        <button id="back-btn">← Back to results</button>
        <div id="artwork-detail"></div>
      </section>

    </main>

    <script src="app.js"></script>
  </body>
</html>
